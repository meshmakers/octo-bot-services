      - IdentifierKind
      - IdentifierValue
  associations:
  - id: System.Identity-2.30.0/IdentifiesUser-1
    targetCkTypeId: System.Identity-2.30.0/User-1
  description: 'Maps a verified external identifier (phone number, e-mail address, EntraID object id or client certificate fingerprint) to an OctoMesh user, carrying the ENROLLMENT trust dimension of the two-dimension channel-identity trust model (AB#5122, Epic AB#4979). The second dimension (per-message trust) is NOT stored here: it depends on the incoming message (Signal protocol / DKIM validity) and is combined by the resolver at resolution time as effective = min(enrollmentTrust, messageTrust). Uniqueness: an (IdentifierKind, IdentifierValue) pair resolves to at most one user within a tenant, enforced by the Unique index below.'
  displayNameRule: ${IdentifierValue}
  derivable: Any
