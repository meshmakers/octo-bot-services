associationRoles:
- id: AssignedRole
  inboundName: AssignedEntities
  outboundName: AssignedRoles
  inboundMultiplicity: N
  outboundMultiplicity: N
  description: Links an entity (User, Client or Group) to an assigned Role.
- id: ChildGroup
  inboundName: ParentGroups
  outboundName: ChildGroups
  inboundMultiplicity: N
  outboundMultiplicity: N
  description: Links a parent Group to a nested child Group.
- id: GrantsPermission
  inboundName: GrantedToRoles
  outboundName: GrantedPermissions
  inboundMultiplicity: N
  outboundMultiplicity: N
  description: Links a Role to a granted DataPermission.
- id: GroupMember
  inboundName: MemberOfGroups
  outboundName: Members
  inboundMultiplicity: N
  outboundMultiplicity: N
  description: Links a Group to its member entities (Users, Clients or ExternalTenantUserMappings).
- id: IdentifiesUser
  inboundName: VerifiedExternalIdentifiers
  outboundName: User
  inboundMultiplicity: N
  outboundMultiplicity: One
  description: Links a VerifiedExternalIdentifier to the OctoMesh User it belongs to (AB#5122). One binding points to exactly one user; a user may own many verified identifiers.
- id: MayActAs
  inboundName: Impersonators
  outboundName: MayActAs
  inboundMultiplicity: N
  outboundMultiplicity: N
  description: the origin client may impersonate the target client via the impersonation grant (AB#5114); materialised by the communication reconcile for adapter→pipeline-service-account pairs
- id: PolicyPermission
  inboundName: Policies
  outboundName: Permission
  inboundMultiplicity: N
  outboundMultiplicity: One
  description: Links a DataPolicy to the DataPermission it belongs to.
attributes:
- id: AbsoluteRefreshTokenLifetime
  valueType: Int
  defaultValues:
  - 2592000
  ownership: SeedOwned
  description: Maximum lifetime of a refresh token in seconds. Defaults to 2592000 seconds / 30 days
- id: AccessFailedCount
  valueType: Int
  defaultValues:
  - 0
  ownership: SeedOwned
  description: The number of failed login attempts for the current user.
  securitySensitive: true
- id: AccessTokenLifetime
  valueType: Int
  defaultValues:
  - 3600
  ownership: SeedOwned
  description: Lifetime of access token in seconds (defaults to 3600 seconds / 1 hour)
- id: AccessTokenType
  valueType: Enum
  valueCkEnumId: System.Identity-2.30.0/TokenType-1
  defaultValues:
  - 0
  ownership: SeedOwned
  description: Specifies whether the access token is a reference token or a self contained JWT token (defaults to Jwt).
- id: AllowAccessTokensViaBrowser
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Controls whether access tokens are transmitted via the browser for this client
- id: AllowOfflineAccess
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Specifies whether this client can request refresh tokens (defaults to false)
- id: AllowPlainTextPkce
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Specifies whether a proof key can be sent using plain method (not recommended and defaults to false).
- id: AllowRememberConsent
  valueType: Boolean
  defaultValues:
  - true
  ownership: SeedOwned
  description: Specifies whether user can choose to store consent decisions (defaults to true)
- id: AllowSelfRegistration
  valueType: Boolean
  defaultValues:
  - true
  ownership: SeedOwned
  description: Controls whether new users can self-register via this identity provider. When false, only existing users can authenticate.
- id: AllowedAccessTokenSigningAlgorithms
  valueType: StringArray
  defaultValues: []
  ownership: SeedOwned
  description: Signing algorithm for access token. If empty, will use the server default signing algorithm.
- id: AllowedCorsOrigins
  valueType: RecordArray
  valueCkRecordId: System.Identity-2.30.0/ClientUriEntry-1
  defaultValues: []
  isRuntimeState: true
  description: Gets or sets the allowed CORS origins for JavaScript clients. Each entry carries a Source marker (see RedirectUris). Runtime-state for the same reason (AB#5210).
- id: AllowedGrantTypes
  valueType: StringArray
  ownership: SeedOwned
  description: Specifies the allowed grant types (legal combinations of AuthorizationCode, Implicit, Hybrid, ResourceOwner, ClientCredentials). Defaults to Implicit.
- id: AllowedIdentityTokenSigningAlgorithms
  valueType: StringArray
  defaultValues: []
  ownership: SeedOwned
  description: Signing algorithm for identity token. If empty, will use the server default signing algorithm.
- id: AllowedScopes
  valueType: StringArray
  defaultValues: []
  ownership: SeedOwned
  description: Specifies the api scopes that the client is allowed to request. If empty, the client can't access any scope
- id: AlwaysIncludeUserClaimsInIdToken
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: When requesting both an id token and access token, should the user claims always be added to the id token instead of requiring the client to use the userinfo endpoint.
- id: AlwaysSendClientClaims
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Gets or sets a value indicating whether client claims should be always included in the access tokens - or only for client credentials flow.
- id: Authority
  valueType: String
  ownership: SeedOwned
  description: Gets or sets the URI of the provider, or discovery endpoint for OpenID Connect discovery.
- id: AuthorizationCodeLifetime
  valueType: Int
  defaultValues:
  - 300
  ownership: SeedOwned
  description: Lifetime of authorization code in seconds (defaults to 300 seconds / 5 minutes)
- id: AuthorizationRtId
  valueType: String
  ownership: SeedOwned
  description: RtId of the OAuthAuthorization this token belongs to.
- id: AuthorizationType
  valueType: String
  ownership: SeedOwned
  description: OpenIddict authorization type (permanent or ad-hoc).
- id: AutoProvisionInChildTenants
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: When true, the client is auto-provisioned (mirrored) into every new child tenant of the tenant it lives in. Enables a single client identity (e.g. CI/CD service) to reach many tenants without per-tenant manual setup.
- id: BackChannelLogoutSessionRequired
  valueType: Boolean
  defaultValues:
  - true
  ownership: SeedOwned
  description: Specifies if the user's session id should be sent to the BackChannelLogoutUri. Defaults to true.
- id: BackChannelLogoutUri
  valueType: String
  ownership: SeedOwned
  description: Specifies logout URI at client for HTTP back-channel based logout.
- id: ChildTenantId
  valueType: String
  ownership: SeedOwned
  description: The tenant ID of the child tenant in a parent-child mirror relationship.
- id: CibaLifetime
  valueType: Int
  ownership: SeedOwned
  description: The backchannel authentication request lifetime in seconds.
- id: ClaimType
  valueType: String
  ownership: SeedOwned
  description: The type of the claim.
- id: ClaimValue
  valueType: String
  ownership: SeedOwned
  description: The value of the claim.
- id: ClaimValueType
  valueType: String
  ownership: SeedOwned
  description: The value type of the claim.
- id: ClientClaims
  valueType: RecordArray
  valueCkRecordId: System.Identity-2.30.0/ClientClaim-1
  defaultValues: []
  ownership: SeedOwned
  description: Gets or sets the client claims to be sent to the user info endpoint.
- id: ClientClaimsPrefix
  valueType: String
  defaultValues:
  - client_
  ownership: SeedOwned
  description: Gets or sets a value to prefix it on client claim types. Defaults to client_.
- id: ClientId
  valueType: String
  ownership: SeedOwned
- id: ClientSecret
  valueType: Secret
  ownership: Secret
  isRuntimeState: true
  description: Gets or sets the client secret of the external identity provider application.
- id: ClientUri
  valueType: String
  isRuntimeState: true
  description: URI to further information about client (used on consent screen). Runtime-state for the same reason as RedirectUris (AB#5210).
- id: ConsentLifetime
  valueType: Int
  ownership: SeedOwned
  description: Lifetime of a user consent in seconds. Defaults to null (no expiration)
- id: ConsumedDateTime
  valueType: DateTime
  ownership: SeedOwned
- id: CoordinateLifetimeWithUserSession
  valueType: Boolean
  ownership: SeedOwned
  description: When enabled, the client's token lifetimes (e.g. refresh tokens) will be tied to the user's session lifetime.
- id: CreationDateTime
  valueType: DateTime
  ownership: SeedOwned
- id: DPoPClockSkew
  valueType: TimeSpan
  defaultValues:
  - 00:05:00
  ownership: SeedOwned
  description: Clock skew used in validating the client's DPoP proof token 'iat' claim value. Defaults to 5 minutes.
- id: DPoPValidationMode
  valueType: Int
  defaultValues:
  - 1
  ownership: SeedOwned
  description: Enum setting to control validation for the DPoP proof token expiration.
- id: Data
  valueType: String
  ownership: SeedOwned
- id: DefaultGroupRtId
  valueType: String
  ownership: SeedOwned
  description: Optional RtId of a group to which new users are automatically added on first login via this provider.
- id: DeviceCodeLifetime
  valueType: Int
  defaultValues:
  - 300
  ownership: SeedOwned
  description: Specifies the lifetime (in seconds) of the device code. Defaults to 300 seconds / 5 minutes.
- id: DisplayName
  valueType: String
  ownership: SeedOwned
  description: Optional display name of the user owning the session.
- id: DynamicRegistration
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: When true, this Client was created at runtime via RFC 7591 Dynamic Client Registration (an interactive MCP client such as Claude Code self-registering), not seeded by a blueprint nor created via the System API. Distinguishes dynamic clients for lifecycle handling (TTL cleanup, per-tenant cap) and cleanup-gate protection. Default false = every pre-existing and operator-created client.
- id: DynamicRegistrationExpiresAt
  valueType: DateTime
  ownership: SeedOwned
  description: UTC expiry of a dynamically-registered Client (RFC 7591). The cleanup sweep erases dynamic clients past this instant. Unset for non-dynamic clients.
- id: Email
  valueType: String
  ownership: SeedOwned
  description: The email address of the user.
  securitySensitive: true
- id: EmailConfirmed
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Indicates if the email address of the user has been confirmed.
- id: EmailDomainPattern
  valueType: String
  ownership: SeedOwned
  description: Email domain pattern to match (e.g., "meshmakers.com"). Matched against the domain part of the user's email.
- id: EnableLocalLogin
  valueType: Boolean
  defaultValues:
  - true
  ownership: SeedOwned
  description: Specifies if this client can use local accounts. Defaults to true.
- id: EnrolledAt
  valueType: DateTime
  ownership: SeedOwned
  description: UTC timestamp when the identifier was first enrolled for the user.
- id: EnrollmentTrust
  valueType: Enum
  valueCkEnumId: System.Identity-2.30.0/TrustLevel-1
  defaultValues:
  - 0
  ownership: SeedOwned
  description: The stored ENROLLMENT trust dimension (None/Weak/Strong) - does the identifier belong to the user? Raised to Strong by the sibling enrollment WIs on a proven OTP/cert/IdP enrollment. Defaults to None.
- id: ExpirationDateTime
  valueType: DateTime
  ownership: SeedOwned
- id: FirstName
  valueType: String
  ownership: SeedOwned
  description: The first name of the user.
- id: FriendlyName
  valueType: String
  ownership: SeedOwned
  description: Friendly name of an ASP.NET Data Protection key-ring element (format key-{guid}).
- id: FrontChannelLogoutSessionRequired
  valueType: Boolean
  defaultValues:
  - true
  ownership: SeedOwned
  description: Specifies if the user's session id should be sent to the FrontChannelLogoutUri. Defaults to true.
- id: FrontChannelLogoutUri
  valueType: String
  ownership: SeedOwned
  description: Specifies logout URI at client for HTTP front-channel based logout.
- id: GrantKey
  valueType: String
  ownership: SeedOwned
- id: GrantType
  valueType: String
  ownership: SeedOwned
- id: GroupDescription
  valueType: String
  ownership: SeedOwned
  description: An optional description of the group's purpose.
- id: GroupName
  valueType: String
  ownership: SeedOwned
  description: The display name of the group.
- id: Host
  valueType: String
  ownership: SeedOwned
  description: Gets or sets the host address of the identity provider.
- id: IdentifierKind
  valueType: Enum
  valueCkEnumId: System.Identity-2.30.0/IdentifierKind-1
  defaultValues:
  - 0
  ownership: SeedOwned
  description: The kind of external identifier (PhoneNumber, EmailAddress, EntraIdObjectId, ClientCertificateFingerprint).
- id: IdentifierSource
  valueType: Enum
  valueCkEnumId: System.Identity-2.30.0/IdentifierSource-1
  defaultValues:
  - 0
  ownership: SeedOwned
  description: Provenance of the binding (SelfService, Admin, IdentityProvider). Defaults to SelfService.
- id: IdentifierValue
  valueType: String
  ownership: SeedOwned
  description: The normalized external identifier value (E.164 phone number, normalized e-mail address, EntraID object id, or certificate fingerprint).
- id: IdentityProviderRestrictions
  valueType: StringArray
  defaultValues: []
  ownership: SeedOwned
  description: Specifies which external IdPs can be used with this client (if list is empty all IdPs are allowed). Defaults to empty.
- id: IdentityRoleIds
  valueType: StringArray
  defaultValues: []
  ownership: SeedOwned
- id: IdentityTokenLifetime
  valueType: Int
  defaultValues:
  - 300
  ownership: SeedOwned
  description: Lifetime of identity token in seconds (defaults to 300 seconds / 5 minutes)
- id: IncludeJwtId
  valueType: Boolean
  defaultValues:
  - true
  ownership: SeedOwned
  description: Value indicating whether JWT access tokens should include an identifier. Defaults to true.
- id: InitiateLoginUri
  valueType: String
  ownership: SeedOwned
  description: Gets of sets a URI that can be used to initiate login from the IdentityServer host or a third party.
- id: IsEmphasized
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Specifies whether the consent screen will emphasize this scope (if the consent screen wants to implement such a feature). Defaults to false.
- id: IsRequired
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Specifies whether the user can de-select the scope on the consent screen (if the consent screen wants to implement such a feature). Defaults to false.
- id: LastName
  valueType: String
  ownership: SeedOwned
  description: The last name of the user.
- id: LastVerifiedAt
  valueType: DateTime
  ownership: SeedOwned
  description: UTC timestamp of the most recent successful verification of the identifier.
- id: LockoutEnabled
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Flag indicating if the user could be locked out.
- id: LockoutEnd
  valueType: DateTimeOffset
  ownership: SeedOwned
  description: The date and time, in UTC, when any user lockout ends.
  securitySensitive: true
- id: LoginProvider
  valueType: String
  ownership: SeedOwned
- id: LogoUri
  valueType: String
  ownership: SeedOwned
  description: URI to client logo (used on consent screen)
- id: MappedRoleIds
  valueType: StringArray
  ownership: SeedOwned
  description: The role IDs assigned to the mapped user in this tenant.
- id: NormalizedEmail
  valueType: String
  ownership: SeedOwned
  description: The normalized email address of the user.
- id: NormalizedGroupName
  valueType: String
  ownership: SeedOwned
  description: The normalized (uppercase) group name for case-insensitive lookup.
- id: NormalizedName
  valueType: String
  ownership: SeedOwned
  description: The normalized name.
- id: NormalizedUserName
  valueType: String
  ownership: SeedOwned
  description: The normalized user name.
- id: PairWiseSubjectSalt
  valueType: String
  ownership: SeedOwned
  description: Gets or sets a salt value used in pair-wise subjectId generation for users of this client.
- id: ParentTenantId
  valueType: String
  ownership: SeedOwned
  description: The tenant ID of the parent tenant that provides user authentication.
- id: PasswordHash
  valueType: String
  ownership: Secret
  isRuntimeState: true
  description: The salted and hashed representation of the password for this user. Secret (System.Identity 2.27.0) - never part of an ExportRt, kept on a blueprint re-apply.
  securitySensitive: true
- id: Payload
  valueType: String
  ownership: SeedOwned
  description: Protected token payload for reference tokens.
- id: PermissionId
  valueType: String
  ownership: SeedOwned
- id: PhoneNumber
  valueType: String
  ownership: SeedOwned
  description: The phone number of the user.
- id: PhoneNumberConfirmed
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Indicates if the phone number of the user has been confirmed.
- id: PolicyActions
  valueType: StringArray
  defaultValues: []
  ownership: SeedOwned
  description: 'Granted actions: Read, Write, Delete.'
- id: PolicyEnforcementMode
  valueType: Enum
  valueCkEnumId: System.Identity-2.30.0/DataPolicyEnforcementMode-1
  defaultValues:
  - 0
  ownership: TenantOwned
  isRuntimeState: true
  description: Enforce applies the policy; AuditOnly only logs violations without filtering or rejecting (migration mode). Owned by the tenant - a blueprint update or re-apply keeps the stored value (a tenant that switched to Enforce stays on Enforce) and only initialises a new policy.
- id: PolicyScope
  valueType: Enum
  valueCkEnumId: System.Identity-2.30.0/DataPolicyScope-1
  defaultValues:
  - 0
  ownership: TenantOwned
  isRuntimeState: true
  description: All grants access to every entity of the target types; OwnedOnly restricts to entities created by the caller (RtCreatedBy). Owned by the tenant - a blueprint update or re-apply keeps the stored value and only initialises a new policy.
- id: PollingInterval
  valueType: Int
  ownership: SeedOwned
  description: The backchannel authentication request polling interval in seconds.
- id: Port
  valueType: Int
  defaultValues:
  - 636
  ownership: SeedOwned
  description: Gets or sets the host port of the identity provider.
- id: PostLogoutRedirectUris
  valueType: RecordArray
  valueCkRecordId: System.Identity-2.30.0/ClientUriEntry-1
  defaultValues: []
  isRuntimeState: true
  description: Specifies allowed URIs to redirect to after logout. Each entry carries a Source marker (see RedirectUris). Runtime-state for the same reason (AB#5210).
- id: PreferredChannelBindingId
  valueType: String
  ownership: SeedOwned
  description: The rtId of the VerifiedExternalIdentifier chosen as preferred outbound channel target for system-initiated messages (null = no preference). The channel kind is derived from the referenced binding. Set via self-service, restricted to the user's own valid bindings.
- id: Properties
  valueType: String
  ownership: SeedOwned
  description: Additional OpenIddict properties as a JSON object.
- id: ProtectBlueprintLocked
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Opt-in restriction (not a grant). When true, non-system callers cannot update or delete entities of the target types whose RtBlueprintLocked is true, nor set or change RtBlueprintLocked, RtBlueprintSource and RtBlueprintAppliedAt on them (refused with message 6384; AuditOnly policies only audit). Blueprint-owned - set by the blueprint seed, re-applied on every blueprint update. Default false.
- id: ProtocolType
  valueType: String
  defaultValues:
  - oidc
  ownership: SeedOwned
- id: ProviderDisplayName
  valueType: String
  ownership: SeedOwned
- id: ProviderKey
  valueType: String
  ownership: SeedOwned
- id: ProvisionedAt
  valueType: DateTime
  ownership: SeedOwned
  description: UTC timestamp when the mirror was provisioned.
- id: ProvisionedByParentTenantId
  valueType: String
  ownership: SeedOwned
  description: When set on a Client living in a child tenant, marks this record as a mirror of a parent-tenant client identified by the given tenant id. Sub-tenant admins surface this as a read-only "Provisioned by parent tenant" indicator; the operator cannot edit the client locally — changes must go through the parent.
- id: RedemptionDateTime
  valueType: DateTime
  ownership: SeedOwned
  description: Point in time a single-use token was redeemed.
- id: RedirectUris
  valueType: RecordArray
  valueCkRecordId: System.Identity-2.30.0/ClientUriEntry-1
  defaultValues: []
  isRuntimeState: true
  description: 'Specifies allowed URIs to return tokens or authorization codes to. Each entry carries a Source marker so local-dev / operator overlay URIs can coexist with base (blueprint) URIs. Runtime-state (AB#5210, same reasoning as Hostname in AB#4706): the productive URI is the public hostname of the deployment, which is tenant-specific and operator-managed and which no seed can derive - ${octo.domain} is the PLATFORM domain while apps are served from their own. A blueprint re-apply therefore preserves what the operator set instead of resetting it to the seeded default and silently breaking sign-in with invalid_redirect_uri. Deliberate trade-off - changing this URI in a seed no longer reaches tenants that already hold the client; use ApplyClientOverlay or set it explicitly.'
- id: ReferenceId
  valueType: String
  ownership: SeedOwned
  description: Hashed reference identifier used to look up reference tokens (device/user codes).
- id: RefreshTokenExpiration
  valueType: Enum
  valueCkEnumId: System.Identity-2.30.0/TokenExpiration-1
  defaultValues:
  - 1
  ownership: SeedOwned
  description: Gets or sets a value indicating whether the access token (and its claims) should be updated on a refresh token request.
- id: RefreshTokenUsage
  valueType: Enum
  valueCkEnumId: System.Identity-2.30.0/TokenUsage-1
  ownership: SeedOwned
  description: Gets or sets a value indicating whether the refresh token should be updated on a refresh token request.
- id: RenewalDateTime
  valueType: DateTime
  ownership: SeedOwned
  description: UTC timestamp of the last sliding-expiration renewal of the session.
- id: RequireClientSecret
  valueType: Boolean
  defaultValues:
  - true
  ownership: SeedOwned
- id: RequireConsent
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Specifies whether a consent screen is required. Defaults to false.
- id: RequireDPoP
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Specifies whether a DPoP (Demonstrating Proof-of-Possession) token is required to be used by this client (defaults to false)
- id: RequirePkce
  valueType: Boolean
  defaultValues:
  - true
  ownership: SeedOwned
  description: Specifies whether a proof key is required for authorization code based token requests (defaults to true).
- id: RequireRequestObject
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Specifies whether the client must use a request object on authorize requests (defaults to false).
- id: RequireResourceIndicator
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
- id: RequiredMessageAuthentication
  valueType: Boolean
  defaultValues:
  - false
  ownership: SeedOwned
  description: Channel expectation for the per-message trust dimension - whether the channel behind this binding is expected to authenticate every message (Signal-verified / DKIM-valid). The per-message trust itself is not stored; the resolver combines it per call with EnrollmentTrust.
- id: ResetPasswordOnLogin
  valueType: Boolean
  defaultValues:
  - true
  ownership: SeedOwned
  description: Force the user to change the password after the next login.
- id: ResourceClaims
  valueType: StringArray
  defaultValues: []
  ownership: SeedOwned
- id: RoleClaims
  valueType: RecordArray
  valueCkRecordId: System.Identity-2.30.0/RoleClaim-1
  ownership: SeedOwned
  description: The claims of a role.
- id: RoleId
  valueType: String
  ownership: SeedOwned
- id: RoleIds
  valueType: StringArray
  ownership: SeedOwned
  description: The id of roles the user is a member of.
- id: Scheme
  valueType: String
  ownership: SeedOwned
  description: The ASP.NET authentication scheme that produced the session ticket.
- id: Scopes
  valueType: StringArray
  ownership: SeedOwned
  description: Models the scopes this API resource allows.
- id: SecretHashVersion
  valueType: Int
  defaultValues:
  - 0
  ownership: SeedOwned
  description: Monotonic counter incremented on every secret rotation of the parent client. Used to detect mirrors that fell behind on a rotation.
- id: SecretType
  valueType: String
  defaultValues:
  - SharedSecret
  ownership: SeedOwned
- id: Secrets
  valueType: RecordArray
  valueCkRecordId: System.Identity-2.30.0/Secret-1
  defaultValues: []
  ownership: SeedOwned
- id: SecurityStamp
  valueType: String
  ownership: Secret
  isRuntimeState: true
  description: A random value that should change whenever a users credentials have been compromised. Secret (System.Identity 2.27.0) - never part of an ExportRt, kept on a blueprint re-apply.
  securitySensitive: true
- id: SessionId
  valueType: String
  ownership: SeedOwned
- id: SessionKey
  valueType: String
  ownership: SeedOwned
  description: Unique key of a server-side session (the only value stored in the browser cookie).
- id: ShowInDiscoveryDocument
  valueType: Boolean
  defaultValues:
  - true
  ownership: SeedOwned
  description: Gets or sets a value indicating whether the client will be shown in the discovery document. Defaults to true.
- id: SlidingRefreshTokenLifetime
  valueType: Int
  defaultValues:
  - 1296000
  ownership: SeedOwned
