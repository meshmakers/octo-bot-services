  methods:
  - methodId: ChangePassword-1
    description: The signed-in user changes their own password. Needs the current password; an administrator uses ResetPassword.
    parameters:
    - name: currentPassword
      valueType: String
      sensitive: true
      description: The current password of the caller.
    - name: newPassword
      valueType: String
      sensitive: true
      description: The new password; must satisfy the password policy of the tenant.
    errors:
    - code: PASSWORD_POLICY_VIOLATION
      description: The new password violates the password policy.
    - code: CURRENT_PASSWORD_INVALID
      description: The current password is wrong.
    - code: USER_LOCKED_OUT
      description: The user is locked out.
    - code: SHADOW_USER_PASSWORD_NOT_ALLOWED
      description: A cross-tenant shadow user has no password.
    authorization:
      allowSelf: true
      dataAccess: Write
  - methodId: ResetPassword-1
    description: An administrator sets a new password without the current one. Lifts a lockout; the user is notified.
    parameters:
    - name: newPassword
      valueType: String
      sensitive: true
      description: The new password; must satisfy the password policy of the tenant.
    errors:
    - code: PASSWORD_POLICY_VIOLATION
      description: The new password violates the password policy.
    - code: SHADOW_USER_PASSWORD_NOT_ALLOWED
      description: A cross-tenant shadow user has no password.
    authorization:
      roles:
      - UserManagement
      dataAccess: Write
  - methodId: SetRoles-1
    description: Replaces the direct roles of the user by the given role names.
    parameters:
    - name: roleNames
      valueType: StringArray
      description: The complete list of direct role names.
    errors:
    - code: ROLE_NOT_FOUND
      description: A role name does not exist.
    authorization:
      roles:
      - UserManagement
      dataAccess: Write
  - methodId: AddRole-1
    description: Adds one direct role to the user.
    parameters:
    - name: roleName
      valueType: String
    errors:
    - code: ROLE_NOT_FOUND
      description: The role does not exist.
    - code: ROLE_ALREADY_ASSIGNED
      description: The user already has the role.
    authorization:
      roles:
      - UserManagement
      dataAccess: Write
  - methodId: RemoveRole-1
    description: Removes one direct role from the user.
    parameters:
    - name: roleName
      valueType: String
    errors:
    - code: ROLE_NOT_FOUND
      description: The role does not exist.
    - code: ROLE_NOT_ASSIGNED
      description: The user does not have the role.
    authorization:
      roles:
      - UserManagement
      dataAccess: Write
  - methodId: Merge-1
    description: Moves the external logins of the source user to this user (the target) and deletes the source user.
    parameters:
    - name: sourceUserName
      valueType: String
      description: User name of the user that is merged into this one and deleted.
    errors:
    - code: SOURCE_USER_NOT_FOUND
      description: The source user does not exist.
    - code: CANNOT_MERGE_INTO_ITSELF
      description: Source and target are the same user.
    - code: MERGE_FAILED
      description: A login could not be moved or the source user could not be deleted.
    authorization:
      roles:
      - UserManagement
      dataAccess: Write
  - methodId: DisableTwoFactor-1
    description: "An administrator switches off the second factor of the user: removes the authenticator key and the recovery codes, rotates the security stamp and revokes the user's refresh tokens. The user signs in with the password and enrols again."
    authorization:
      roles:
      - UserManagement
      dataAccess: Write
  - methodId: CreateUser-1
    kind: Static
    description: Creates a user (REST user creation is unchanged).
    parameters:
    - name: userName
      valueType: String
    - name: email
      valueType: String
      isOptional: true
    - name: firstName
      valueType: String
      isOptional: true
    - name: lastName
      valueType: String
      isOptional: true
    - name: password
      valueType: String
      isOptional: true
      sensitive: true
      description: Initial password; without it the user gets the welcome notification without a password.
    result:
      valueType: String
    errors:
    - code: USER_NAME_RESERVED
      description: The user name is reserved for cross-tenant shadow users.
    - code: USER_ALREADY_EXISTS
      description: A user with this name or e-mail address exists.
    - code: PASSWORD_POLICY_VIOLATION
      description: The initial password violates the password policy.
    authorization:
      roles:
      - UserManagement
  derivable: Any
