"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: Location
    derivedFromCkTypeId: ${System}/Entity
    isAbstract: true
    attributes:
    - id: ${this}/Name
      name: Name

  - typeId: Continent
    derivedFromCkTypeId: ${this}/Location

  - typeId: Country
    derivedFromCkTypeId: ${this}/Location
    attributes:
    - id: ${this}/Secret
      name: Secret
      isOptional: true
      access: Hidden
    associations:
    - id: ${System}/ParentChild
      targetCkTypeId: ${this}/Continent
