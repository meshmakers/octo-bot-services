parameters:
  - name: GenerateDocumentation
    type: boolean

steps:
  - task: DotNetCoreCLI@2
    condition: ${{ eq(parameters.GenerateDocumentation, 'true') }}
    displayName: 'Generate Documentation'
    inputs:
      command: 'build'
      projects: '**/SystemBotCkModel.csproj'
      arguments: '--configuration Release /p:OctoGenerateCkDocumentation=true'
      
  - task: CopyFiles@2
    condition: ${{ eq(parameters.GenerateDocumentation, 'true') }}
    displayName: 'Copy Files from $(Build.SourcesDirectory)/**/bin/**/octo-ck-libraries/SystemBotCkModel/** to $(build.artifactstagingdirectory)'
    inputs:
      SourceFolder: $(Build.SourcesDirectory)
      Contents: |
        /**/bin/**/octo-ck-libraries/SystemBotCkModel/**
      TargetFolder: $(build.artifactstagingdirectory)