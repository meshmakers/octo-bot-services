# Root-level CI pipeline using shared templates from octo-pipeline-templates.
#
# Coexists with devops-build/azure-pipelines.yml during the Phase 1-services
# pilot. Once parity is verified, def 94 yamlFilename can be flipped to this
# file and devops-build/ deleted in a follow-up commit. Services-train
# references def 94 by ID so the train is unaffected by the yamlFilename swap.
#
# Bot-specific quirks preserved from the legacy YAML:
#   - InstallSSHKey (no submodules:recursive — checkout has clean only)
#   - download-ca — internal CA for dotnet restore
#   - Build and Test pass /p:OctoPublishCkModel=false — the shared CK step publishes System.Bot
#   - SystemTests excluded
#   - HAS push-nuget — bot publishes Meshmakers.Octo.Bots NuGets
#   - HAS CK library output: SystemBotCkModel

name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

parameters:
  # Injected by the release train on r-tag builds so the whole chain pins the
  # scheduler-determined lib/comm release version (forwarded to
  # update-build-number.yml). Default 'auto' = no override (version computed
  # normally); the train injects the real version on r-tag.
  - name: octoCoreLibVersion
    type: string
    default: 'auto'
  - name: octoCommVersion
    type: string
    default: 'auto'

resources:
  # Chain link: exactly ONE upstream pipeline resource per repo. Pipeline
  # resource triggers do NOT batch, so a repo with two trigger parents is
  # started twice per main cascade. The chain is therefore a single-parent
  # tree; artificial ordering edges (marked below) resolve real DAG joins.
  # Full picture: octo-mesh-deployment/pipelines/orchestrator-ci.yml.
  pipelines:
    - pipeline: octo-common-services
      source: octo-common-services-CI
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v1.3.1

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  # Docs-only commits must not start CI (AB#5719). Excluded paths are
  # never consumed by the build; a root README.md change reaches the
  # packed NuGet readme with the next code commit.
  paths:
    exclude:
      - '**/*.md'
      - '*.md'
      - '.claude/'
  tags:
    exclude:
      - '*'

variables:
  - group: GitSSHGroup
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: solutionFile
    value: 'Octo.Bots.sln'
  - name: artifactsFrameworkVersion
    value: 'net10.0'
  - name: buildConfiguration
    value: 'Release'
  - name: buildPlatform
    value: 'Any CPU'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}

stages:
  - stage: Build
    jobs:
      - job: linux
        displayName: 'Build, test, push Docker image and NuGets'
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
            parameters:
              octoCoreLibVersionOverride: ${{ replace(parameters.octoCoreLibVersion, 'auto', '') }}
              octoCommVersionOverride: ${{ replace(parameters.octoCommVersion, 'auto', '') }}
          - checkout: self
            clean: true
          # Redundant-run guard (AB#6344): tags the run with its input fingerprint and, per the pipeline
          # variable CiGuardMode (default report = tags only, off = disabled, rollback), logs or ends a
          # main run whose inputs an equal run already built or a newer run supersedes. Steps after it
          # need ne(variables['CiGuardEnded'], 'true') before skip is switched on (report/off need nothing).
          - template: templates/steps/guard-redundant-run.yml@pipelineTemplates
            parameters:
              parentPipelineId: $(resources.pipeline.octo-common-services.pipelineID)
              parentRunId: $(resources.pipeline.octo-common-services.runID)
          - task: InstallSSHKey@0
            displayName: 'Install SSH key'
            inputs:
              knownHostsEntry: '$(SSHKnownHosts)'
              sshPublicKey: '$(SSHPublicKey)'
              sshPassphrase: '$(SSHPassphrase)'
              sshKeySecureFile: '$(SSHPrivateKeyFile)'
          - template: templates/steps/set-version.yml@pipelineTemplates
          - template: templates/steps/download-ca.yml@pipelineTemplates
          # Fresh package list for the private feed only; nuget.org stays cached.
          # Replaces restore --force and noCache (AB#5720).
          - template: templates/steps/purge-private-nuget-http-cache.yml@pipelineTemplates
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(solutionFile)'
              restoreArguments: '/p:OctoNugetPrivateServer=$(nugetPrivateServer)'
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(solutionFile)'
              arguments: '--configuration $(buildConfiguration) /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoPublishCkModel=false /p:OctoPrivateGitHubApiKey=$(GitHubPAT) /p:OctoPublicGitHubApiKey=$(GitHubPAT)'
              publishWebProjects: false
              zipAfterPublish: false
              modifyOutputPath: false
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Test'
            inputs:
              command: 'test'
              arguments: '--no-build --configuration $(buildConfiguration) /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoPublishCkModel=false'
              projects: |
                **/*Tests.csproj
                !**/*SystemTests.csproj
              testRunTitle: 'CI'
          - template: templates/steps/validate-and-publish-ck-versions.yml@pipelineTemplates
            parameters:
              constructionKitPaths:
                - 'src/SystemBotCkModel/ConstructionKit'
          # Multi-arch image (AB#4451): arm64 for Apple-Silicon kind clusters and
          # edge devices, amd64 for the managed clusters.
          - template: templates/steps/build-and-push-docker.yml@pipelineTemplates
            parameters:
              publicRegistryServiceConnection: $(DockerRegistryPublicConnection)
              privateRegistryName: $(DockerRegistryPrivateUri)
              repository: meshmakers/octo-mesh-bot-services
              dockerfile: src/BotServices/Dockerfile
              platforms: 'linux/arm64,linux/amd64'
              enableMainLatestTag: true
          - template: templates/steps/handle-artifacts.yml@pipelineTemplates
            parameters:
              constructionKitLibraryPaths:
                - 'src/SystemBotCkModel/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/SystemBotCkModel'
          - template: templates/steps/push-nuget-package.yml@pipelineTemplates
