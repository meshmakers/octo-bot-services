"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: ServiceHook
    derivedFromCkTypeId: ${System}/Entity
    isFinal: false
    isAbstract: false
    attributes:
      - id: ${System}/Enabled
        name: Enabled
      - id: ${System}/Query.CkTypeId
        name: QueryCkTypeId
      - id: ${System}/Query.FieldFilter
        name: FieldFilter
      - id: ${System}/Name
        name: Name
      - id: ${this}/ServiceHook.Uri
        name: ServiceHookBaseUri
      - id: ${this}/ServiceHook.Action
        name: ServiceHookAction
      - id: ${this}/ServiceHook.ApiKey
        name: ServiceHookApiKey
        isOptional: true