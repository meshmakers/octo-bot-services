"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: Fixup
    derivedFromCkTypeId: ${System}/Entity
    isFinal: false
    isAbstract: false
    attributes:
      - id: ${System}/Enabled
        name: Enabled
      - id: ${System}/Name
        name: Name
      - id: ${this}/Fixup.Order
        name: Order
      - id: ${this}/Fixup.Script
        name: Script
      - id: ${this}/Fixup.IsApplied
        name: IsApplied
      - id: ${this}/Fixup.AppliedAt
        name: AppliedAt
        isOptional: true
      - id: ${this}/Fixup.Output
        name: Output
        isOptional: true
      - id: ${this}/Fixup.Error
        name: Error
        isOptional: true
      - id: ${this}/Fixup.IsSuccess
        name: IsSuccess
        isOptional: true