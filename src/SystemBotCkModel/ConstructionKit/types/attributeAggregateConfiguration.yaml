$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: AttributeAggregateConfiguration
  derivedFromCkTypeId: ${System}/Entity
  attributes:
  - id: ${System}/Enabled
    name: IsAutoCompleteEnabled
  - id: ${thisModel}/AutoCompleteFilter
    name: AutoCompleteFilter
  - id: ${thisModel}/AutoCompleteLimit
    name: AutoCompleteLimit
  associations:
  - id: ${thisModel}/Configures
    targetCkTypeId: ${System}/Entity
